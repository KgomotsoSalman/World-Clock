<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.0/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>World Clock</title>
</head>

<body>

    <div class="container">
        <h1>World Clock</h1>

        <select id="city">
          <option value="">Select a city..</option>
          <option value="current">My Current Location</option>
          <option value="Africa/Cape Town">Cape Town</option>
          <option value="Africa/Lagos">Lagos</option>
          <option value="Asia/Seoul">Seoul</option>
        </select>

        <div id="cities">
            <div class="city" id="los-angeles">
                <div>
                    <h2>Los Angeles</h2>
                    <div class="date"></div>
                </div>
                <div class="time"></div>
            </div>
            <div class="city" id="paris">
                <div>
                    <h2>Paris</h2>
                    <div class="date"></div>
                </div>
                <div class="time"></div>
            </div>
        </div>
    </div>
    <footer>This was coded by <strong>Kgomotso Nzulwana </strong>and is hosted on <a href="https://kgomotso-nzulwana-world-clock.netlify.app/">Netlify</a> and open-source on <a href="https://github.com/KgomotsoSalman/World-Clock">Github</a></footer>
    <script src="javascript/index.js"></script>
</body>

</html>
